services:
  - type: web
    name: company-frontend
    runtime: node
    rootDir: my-portfolio-frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT -H 0.0.0.0
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: "production"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://company-frontend.onrender.com
      - key: NEXT_PUBLIC_API_BASE
        value: https://company-frontend.onrender.com
      - key: STRAPI_URL
        value: https://company-strapi.onrender.com
      - key: STRAPI_API_TOKEN
        sync: false
      - key: PORTAL_SESSION_SECRET
        sync: false
      - key: PORTAL_UPLOADER_USER
        sync: false
      - key: PORTAL_UPLOADER_PASS
        sync: false
      - key: PORTAL_ADMIN_USER
        sync: false
      - key: PORTAL_ADMIN_PASS
        sync: false
      - key: STRAPI_PORTFOLIO_ENDPOINT
        value: /api/portfolios
      - key: STRAPI_STATUS_FIELD
        value: review_status
      - key: STRAPI_STATUS_APPROVED
        value: approved
      - key: STRAPI_STATUS_PENDING
        value: pending

  - type: web
    name: company-strapi
    runtime: node
    rootDir: strapi-backend/strapi
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: "production"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "10000"
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_HOST
        fromDatabase:
          name: company-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: company-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: company-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: company-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: company-db
          property: password
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: company-db
          property: connectionString

databases:
  - name: company-db
    plan: free
